# Runs on every push and pull request: lint, test and build both apps on fresh machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend – lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway databases for the tests (CI-only passwords, not real secrets).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustshare
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: trustshare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trustshare" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: trustshare
          MONGO_INITDB_ROOT_PASSWORD: ci-password
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-retries 10

    env:
      POSTGRES_USER: trustshare
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: trustshare
      MONGO_USER: trustshare
      MONGO_PASSWORD: ci-password
      REDIS_PASSWORD: ci-password
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      # Redis needs a password, which GitHub "services" can't pass, so start it directly.
      - name: Start Redis
        run: docker run -d -p 6379:6379 redis:7-alpine redis-server --requirepass ci-password

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend – lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
