name: trustshare

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"

  # S3-compatible object storage for the ENCRYPTED file objects (Milestone 2).
  # RustFS: open-source (Apache-2.0), same API as AWS S3; buckets are private.
  # Console: http://localhost:9001/rustfs/console/
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - objectdata:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
    # --proxy-headers: behind Caddy (or the Vite dev proxy) take the visitor's IP from
    # X-Forwarded-For – but only from proxies inside the private Docker network.
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips 172.16.0.0/12"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - mongo
      - redis
      - rustfs

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # HTTPS entry point (Milestone 2): https://localhost:8443 – TLS by Caddy's local CA.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8443:8443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # the local CA and certificates (kept across restarts)
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  mongodata:
  objectdata:
  caddydata:
