# Production stack for TrustShare – used on the cloud server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (development):
# - the React app is built and served by Caddy (no Vite dev server), the backend runs the lean
#   production image (no live reload, no dev tools, non-root user);
# - only Caddy is reachable from outside (ports 80 and 443); PostgreSQL, MongoDB, Redis and the
#   backend have NO published ports – they are reachable only inside the private Docker network;
# - encrypted files go to Azure Blob Storage (STORAGE_PROVIDER=azure in .env), so there is no RustFS;
# - memory settings fit a small (1 GB) virtual machine.

name: trustshare-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    # Keep MongoDB's cache small on a 1 GB machine (the default would take ~half of the RAM).
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions and tokens must never be evicted silently: refuse writes instead if memory is full.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "96mb",
              "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
      COOKIE_SECURE: "true"
      # One worker process fits a 1 GB VM; raise to 2+ on a bigger machine.
      WEB_WORKERS: ${WEB_WORKERS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data # certificates (kept across restarts, so Let's Encrypt isn't asked again)
      - caddyconfig:/config
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
  redisdata:
  caddydata:
  caddyconfig:
